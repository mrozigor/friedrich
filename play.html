<html lang="en">
<head>

<meta name="theme-color" content="#444">
<meta charset="utf-8">
<title>FRIEDRICH</title>
<link rel="icon" href="favicon/favicon_frederick.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/common/client.css">

<body>

<header>
	<div id="toolbar">
		<details>
			<summary><img src="/images/cog.svg"></summary>

<aside>
	<div id="roles"></div>
	<div id="log"></div>

<div id="power_panel_list">

<div id="clock_of_fate" class="panel_body">

	<div class="card_pile" id="discard_2"></div>
